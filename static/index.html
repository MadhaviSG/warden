<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WARDEN Mission Control</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
--green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;--purple:#bc8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;
border-bottom:1px solid var(--border);background:var(--panel)}
h1{font-size:1.25rem;letter-spacing:.08em}
.subtitle{font-size:.75rem;color:var(--muted);margin-top:.2rem}
.controls{display:flex;align-items:center;gap:1rem}
.toggle{display:flex;align-items:center;gap:.5rem;cursor:pointer;padding:.4rem .8rem;
border-radius:6px;border:1px solid var(--border);transition:.2s}
.toggle.on{border-color:var(--green);background:rgba(63,185,80,.12);color:var(--green)}
.toggle input{display:none}
button{background:var(--blue);color:#fff;border:none;padding:.5rem 1rem;border-radius:6px;
font-weight:600;cursor:pointer;font-size:.85rem}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.presets{display:flex;gap:.5rem;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);flex-wrap:wrap}
.presets button{font-size:.75rem;padding:.35rem .7rem}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem 1.5rem;min-height:calc(100vh - 140px)}
.col{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:400px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border)}
.col-title{font-weight:600;font-size:.9rem}
.badge{font-size:.65rem;padding:.15rem .45rem;border-radius:4px;font-weight:700;letter-spacing:.05em}
.badge.live{background:var(--red);animation:pulse 1.2s infinite}
.badge.recorded{background:var(--purple)}
.badge.score{background:var(--green);animation:none}
.badge.idle{background:var(--border);color:var(--muted);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.gauge{padding:.75rem 1rem;border-bottom:1px solid var(--border)}
.gauge-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:.4rem}
.gauge-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));transition:width .3s}
.gauge-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:.25rem}
.ewma{font-size:.75rem;color:var(--amber);margin-top:.35rem}
.trace{flex:1;overflow-y:auto;padding:.5rem 1rem;font-family:ui-monospace,monospace;font-size:.72rem;line-height:1.5}
.trace .fault{color:var(--amber)}.trace .monitor{color:var(--blue)}.trace .aggregate{color:var(--red);font-weight:600}
.trace .step{color:var(--muted)}.trace .alert{color:var(--green);font-weight:600}
.empty{color:var(--muted);padding:2rem;text-align:center;font-size:.85rem}
label.fault-lbl{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
</style>
</head>
<body>
<header>
  <div><h1>WARDEN</h1><div class="subtitle">Actor-critic mission control</div></div>
  <div class="controls">
    <label class="toggle" id="wardenToggle"><input type="checkbox"> CRITIC (WARDEN)</label>
    <label class="fault-lbl"><input type="checkbox" id="faultCheck" checked> Fault injection (F1@18)</label>
    <button id="launchBtn">LAUNCH RUN</button>
  </div>
</header>
<div class="presets">
  <span style="color:var(--muted);font-size:.75rem;margin-right:.5rem">RECORDED replay:</span>
  <button class="ghost" data-run="R2_fault" data-col="solo">R2 solo (fault)</button>
  <button class="ghost" data-run="R3_warden" data-col="warden">R3 + Warden</button>
  <button class="ghost" data-run="R4_adv_naive" data-col="solo">R4 adversary</button>
  <button class="ghost" data-run="R5_adv_warden" data-col="warden">R5 adv+Warden</button>
</div>
<div class="columns">
  <div class="col" id="col-solo"><div class="col-head"><span class="col-title">ACTOR solo</span><span class="badge idle" id="badge-solo">IDLE</span></div>
    <div class="gauge" id="gauge-solo"><div>Drift score <span id="score-solo">—</span></div><div class="gauge-bar"><div class="gauge-fill" id="fill-solo" style="width:0%"></div></div>
    <div class="gauge-labels"><span>0</span><span>threshold 60</span><span>100</span></div><div class="ewma" id="ewma-solo"></div></div>
    <div class="trace" id="trace-solo"><div class="empty">Launch a LIVE solo run or replay R2/R4</div></div></div>
  <div class="col" id="col-warden"><div class="col-head"><span class="col-title">ACTOR + CRITIC</span><span class="badge idle" id="badge-warden">IDLE</span></div>
    <div class="gauge" id="gauge-warden"><div>Drift score <span id="score-warden">—</span></div><div class="gauge-bar"><div class="gauge-fill" id="fill-warden" style="width:0%"></div></div>
    <div class="gauge-labels"><span>0</span><span>threshold 60</span><span>100</span></div><div class="ewma" id="ewma-warden"></div></div>
    <div class="trace" id="trace-warden"><div class="empty">Launch a LIVE warden run or replay R3/R5</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cols={solo:{run:null,live:false},warden:{run:null,live:false}};
const wToggle=$("wardenToggle"),faultCheck=$("faultCheck"),launchBtn=$("launchBtn");

wToggle.onclick=()=>wToggle.classList.toggle("on",wToggle.querySelector("input").checked);
wToggle.querySelector("input").checked=true;
wToggle.classList.add("on");

async function api(path,opts){const r=await fetch(path,{cache:"no-store",...opts});return r;}

function parseTrace(text){
  const events=[],monitors=[];
  text.split("\n").filter(Boolean).forEach(l=>{try{const e=JSON.parse(l);
    if(e.monitor_check)monitors.push(e.monitor_check);
    else events.push(e);}catch(_){}});
  return{events,monitors};
}

function renderTrace(col,events,monitors){
  const el=$("trace-"+col);if(!events.length&&!monitors.length){return;}
  let html="",lastStep=0;
  const all=[...events.map(e=>({...e,t:"step"})),...monitors.map(m=>({...m,t:"mon"}))];
  all.sort((a,b)=>(a.step||0)-(b.step||0));
  for(const e of all){
    if(e.t==="mon"){
      const agg=e.trigger==="aggregate";
      const lbl=agg?"WEAK-SIGNAL AGGREGATE ALERT":"MONITOR ALERT";
      html+=`<div class="monitor${agg?" aggregate":""}">step ${e.step}: score=${e.score} ewma=${e.ewma??"—"}${e.trigger?` [${e.trigger}]`:""}</div>`;
      if(e.score>=60||agg)html+=`<div class="alert">${lbl}: ${(e.reason||"").slice(0,120)}</div>`;
    }else if(e.fault_injected)html+=`<div class="fault">!!! FAULT ${e.fault_injected} @ step ${e.step}</div>`;
    else if(e.step){lastStep=e.step;html+=`<div class="step">step ${e.step}: ${e.tool||"?"} ${JSON.stringify(e.args||{}).slice(0,60)}</div>`;}
  }
  el.innerHTML=html||'<div class="empty">Waiting for events…</div>';
  el.scrollTop=el.scrollHeight;
}

function updateGauge(col,monitors){
  const m=monitors.length?monitors[monitors.length-1]:null;
  $("score-"+col).textContent=m?m.score:"—";
  $("fill-"+col).style.width=(m?Math.min(m.score,100):0)+"%";
  $("ewma-"+col).textContent=m&&m.ewma!=null?`EWMA: ${m.ewma} (aggregate ≥45)`:"";
}

function setBadge(col,mode,score){
  const b=$("badge-"+col);
  b.className="badge "+(mode||"idle");
  if(mode==="live")b.textContent="LIVE";
  else if(mode==="recorded")b.textContent="RECORDED";
  else if(score!=null){b.textContent="SCORE "+score;b.className="badge score";}
  else b.textContent="IDLE";
}

async function pollRun(col){
  const run=cols[col].run;if(!run)return;
  const tr=await api("/api/trace?run_id="+encodeURIComponent(run));
  const text=await tr.text();
  const{events,monitors}=parseTrace(text);
  renderTrace(col,events,monitors);
  updateGauge(col,monitors);
  if(!cols[col].live)return;
  const st=await(await api("/api/status")).json();
  if(st.run_id===run&&!st.running&&st.done){
    const meta=await(await api("/api/meta?run_id="+run)).json();
    setBadge(col,null,meta.verifier_score);
    cols[col].live=false;launchBtn.disabled=false;
  }
}

async function loadRecorded(runId,col){
  cols[col]={run:runId,live:false};
  setBadge(col,"recorded");
  const tr=await api("/api/trace?run_id="+runId);const{events,monitors}=parseTrace(await tr.text());
  renderTrace(col,events,monitors);updateGauge(col,monitors);
  try{const meta=await(await api("/api/meta?run_id="+runId)).json();setBadge(col,"recorded",meta.verifier_score);}catch(_){}
}

document.querySelectorAll(".presets button").forEach(b=>b.onclick=()=>loadRecorded(b.dataset.run,b.dataset.col));

launchBtn.onclick=async()=>{
  const warden=wToggle.querySelector("input").checked;
  const col=warden?"warden":"solo";
  launchBtn.disabled=true;
  const r=await api("/api/launch",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({warden,fault:faultCheck.checked})});
  if(r.status===409){alert("Run already in progress");launchBtn.disabled=false;return;}
  const{run_id}=await r.json();
  cols[col]={run:run_id,live:true};
  setBadge(col,"live");
  $("trace-"+col).innerHTML='<div class="empty">Live run started…</div>';
};

setInterval(()=>{pollRun("solo");pollRun("warden");},1000);
</script>
</body>
</html>
